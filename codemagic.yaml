workflows:
  build-apk:
    name: IBNEABBAS WORD - APK
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
