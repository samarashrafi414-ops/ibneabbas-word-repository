name: ibneabbas_word
description: "IBNEABBAS WORD — مکمل ایڈوانس اردو/عربی تحقیقی ورڈ پروسیسر (Flutter)"
publish_to: 'none'
version: 2.0.1+10

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_quill: ^10.8.5
  image_picker: ^1.1.2
  archive: ^3.6.1
  xml: ^6.5.0
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_hd.jpg
    - assets/data/quran.json
  fonts:
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: Jameel Noori Nastaleeq
      fonts:
        - asset: assets/fonts/Noori_Regular.ttf
    - family: Gulzar
      fonts:
        - asset: assets/fonts/Gulzar-Regular.ttf
    - family: Mehr Nastaliq Web
      fonts:
        - asset: assets/fonts/MehrNastaliqWeb.ttf
    - family: Alvi Nastaleeq
      fonts:
        - asset: assets/fonts/AlviNastaleeq.ttf
    - family: Nafees Nastaleeq
      fonts:
        - asset: assets/fonts/NafeesNastaleeq.otf
    - family: Nafees Web Naskh
      fonts:
        - asset: assets/fonts/NafeesWebNaskh.otf
    - family: Mirza
      fonts:
        - asset: assets/fonts/Mirza-Regular.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: KFGQPC Uthmanic Script HAFS
      fonts:
        - asset: assets/fonts/UthmanicHafs.otf
    - family: Uthman Taha Naskh
      fonts:
        - asset: assets/fonts/UthmanTaha.otf
    - family: IndoPak Quranic Script
      fonts:
        - asset: assets/fonts/IndoPak.otf
    - family: Tinos
      fonts:
        - asset: assets/fonts/Tinos-Regular.ttf
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo.ttf
    - family: Gelasio
      fonts:
        - asset: assets/fonts/Gelasio-Regular.ttf
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
    - family: Caladea
      fonts:
        - asset: assets/fonts/Caladea-Regular.ttf
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
    - family: B Nazanin
      fonts:
        - asset: assets/fonts/BNazanin.ttf
    - family: B Mitra
      fonts:
        - asset: assets/fonts/BMitra.ttf
    - family: B Lotus
      fonts:
        - asset: assets/fonts/BLotus.ttf
    - family: B Zar
      fonts:
        - asset: assets/fonts/BZar.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
    - family: IranNastaliq
      fonts:
        - asset: assets/fonts/IranNastaliq.ttf
    - family: Gentium Plus
      fonts:
        - asset: assets/fonts/GentiumPlus-Regular.ttf
        - asset: assets/fonts/GentiumPlus-Italic.ttf
